[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "protama-benchmark"
version = "1.0.0"
description = "Public reproducibility harness for the Protama Structural Gate"
requires-python = ">=3.10"
license = { file = "LICENSE" }

[tool.setuptools.packages.find]
where = ["src"]
